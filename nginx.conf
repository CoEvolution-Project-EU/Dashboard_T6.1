server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  location = /fvt {
    return 301 /fvt/;
  }

  # routes to fallback /fvt/index.html
  location /fvt/ {
    try_files $uri $uri/ /fvt/index.html;
  }

  # (for API, to be kept out of fallback #TODO for int.)
  # location /api/ {
  #   proxy_pass http://backend:8080;
  # }
}
