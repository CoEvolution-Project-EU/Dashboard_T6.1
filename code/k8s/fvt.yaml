apiVersion: v1
kind: ConfigMap
metadata:
  name: fvt-config
data:
  SERV_HOST: "https://aegis.coevolution-project.eu"
  SOCKET_HOST: "https://aegis.coevolution-project.eu"
  KEYCLOAK_URL: "https://aegis.coevolution-project.eu"
  API_URL: "/api/v1"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fvt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fvt
  template:
    metadata:
      labels:
        app: fvt
    spec:
      containers:
        - name: fvt
          image: ghcr.io/coevolution-project-eu/coevolution-dash:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: fvt-config
          readinessProbe:
            httpGet:
              path: /fvt/
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /fvt/
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: fvt
spec:
  selector:
    app: fvt
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fvt
spec:
  rules:
    - host: dashboard.example.com
      http:
        paths:
          - path: /fvt
            pathType: Prefix
            backend:
              service:
                name: fvt
                port:
                  number: 80