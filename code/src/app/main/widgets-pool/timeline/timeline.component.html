<div>
    <div class="header">

        <button (click)="removeAnno()" class="clearAnnot" mat-stroked-button>Clear Annotations</button>



        <mat-checkbox style="margin-left:1em; font-size: 14px;" [(ngModel)]="showGroups" (change)="switchGrouping()">
            Grouping:
        </mat-checkbox>

        <div *ngIf="showGroups">
            <ng-select style="width: 150px; font-size: 14px; margin-left: 0.5em;" [closeOnSelect]="true"
                [items]="groupsLabels" [clearable]="false" [multiple]="false" (change)="switchGroups()"
                [(ngModel)]="this.groupsFormat" placeholder="Events Label Format">
            </ng-select>
        </div>

        <mat-checkbox style="margin-left:1em; font-size: 14px;" [(ngModel)]="showLabels" (change)="switchLabels()">
            Labeling:
        </mat-checkbox>

        <div *ngIf="showLabels">
            <ng-select style="width: 150px; font-size: 14px; margin-left: 0.5em;" [closeOnSelect]="true"
                [items]="itemLabels" [clearable]="false" [multiple]="false" (change)="switchLabels()"
                [(ngModel)]="this.labelFormat" placeholder="Events Label Format">
            </ng-select>
        </div>

        <div class="label-group">

                                class="small-circle-btn">
                            </button>
                            <div class="label">
                                {{leg.key}}
                            </div>
                        </div>
                    </div>
                </div>


            </div>

    <div>
        <button mat-icon-button matTooltip="Move Left" (click)="move(0.2)">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Move Right" (click)="move(-0.2)">
