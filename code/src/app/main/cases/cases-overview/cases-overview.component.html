<ngx-spinner [name]="'assets'" [fullScreen]="true" bdColor="#f5f5f583" size="medium" type="ball-fussion"
  color="#EDAE49"></ngx-spinner>

<app-navbar></app-navbar>

<div class="menu">
  <div class="innerNavButtons">
<div class="content-header">
          <button mat-icon-button class="toggle-btn" (click)="toggleSidebar()">
            <mat-icon class="s-18 header"> menu {{ isSidebarOpen ? 'left_panel_close' : 'left_panel_open' }}</mat-icon>
          </button>
          <h1 class="page-title">Configuration Monitoring &amp; Visualisations</h1>
        </div>
  </div>
</div>

<div class="page-container">
  <div class="content">
    <mat-drawer-container class="layout-container">

      <mat-drawer
        #drawer
        [opened]="true"
        mode="side"
        position="start"
        class="side-menu-drawer"
        [class.collapsed]="!isSidebarOpen">

        <div class="drawer-top">
   
          <div class="side-menu-list">
            <button
              *ngFor="let item of menu"
              mat-button
              class="menu-item"
              [routerLink]="[ '/register-model']"
              routerLinkActive="router-link-active"
              [matTooltip]="!isSidebarOpen ? item.name : ''"
              matTooltipPosition="right">

              <mat-icon style="color: var(--light-font-color)">{{ item.icon }}</mat-icon>
              <span class="menu-label" *ngIf="isSidebarOpen">{{ item.name }}</span>
            </button>
          </div>
        </div>

      </mat-drawer>

      <mat-drawer-content>
        

        <div class="assets" fxLayout="row wrap" fxLayoutAlign="center center">
         


        </div>

      </mat-drawer-content>
    </mat-drawer-container>
  </div>
</div>
